<g opacity="0"><animate attributeName="opacity" begin="9.0s" dur="0.4s" values="0;1" fill="freeze"/><animateTransform attributeName="transform" type="translate" begin="9.0s" dur="0.5s" values="0,16;0,0" fill="freeze"/><circle cx="52" cy="140" r="8" fill="#38bdf8"><animate attributeName="r" begin="9.0s" dur="3.0s" values="8;13;8" repeatCount="indefinite"/></circle><text x="84" y="150" font-size="28" fill="#e2e8f0">use safe burial practices.</text><text x="680" y="396" text-anchor="end" font-size="16" fill="#94a3b8">4/4</text></g>
