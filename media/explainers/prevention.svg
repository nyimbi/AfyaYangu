<g opacity="0"><animate attributeName="opacity" begin="0.0s" dur="0.4s" values="0;1" fill="freeze"/><animateTransform attributeName="transform" type="translate" begin="0.0s" dur="0.5s" values="0,16;0,0" fill="freeze"/><animate attributeName="opacity" begin="3.0s" dur="0.4s" values="1;0" fill="freeze"/><circle cx="52" cy="140" r="8" fill="#38bdf8"><animate attributeName="r" begin="0.0s" dur="3.0s" values="8;13;8" repeatCount="indefinite"/></circle><text x="84" y="150" font-size="28" fill="#e2e8f0">Wash hands with soap frequently</text><text x="680" y="396" text-anchor="end" font-size="16" fill="#94a3b8">1/4</text></g>
<g opacity="0"><animate attributeName="opacity" begin="3.0s" dur="0.4s" values="0;1" fill="freeze"/><animateTransform attributeName="transform" type="translate" begin="3.0s" dur="0.5s" values="0,16;0,0" fill="freeze"/><animate attributeName="opacity" begin="6.0s" dur="0.4s" values="1;0" fill="freeze"/><circle cx="52" cy="140" r="8" fill="#38bdf8"><animate attributeName="r" begin="3.0s" dur="3.0s" values="8;13;8" repeatCount="indefinite"/></circle><text x="84" y="150" font-size="28" fill="#e2e8f0">avoid bushmeat</text><text x="680" y="396" text-anchor="end" font-size="16" fill="#94a3b8">2/4</text></g>
