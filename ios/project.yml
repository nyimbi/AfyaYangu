name: AfyaYangu
options:
  bundleIdPrefix: ke.go.health
  deploymentTarget:
    iOS: "17.0"
targets:
  AfyaYangu:
    type: application
    platform: iOS
    sources: [AfyaYangu]
    info:
      path: AfyaYangu/Info.plist
      properties:
        CFBundleDisplayName: Afya Yangu
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocationWhenInUseUsageDescription: Afya Yangu uses your location to find the nearest clinics, pharmacies, schools — and to warn you about outbreak risks near you.
  AfyaYanguTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    # A unit-test bundle still needs an Info.plist. Without one xcodegen emits neither
    # INFOPLIST_FILE nor GENERATE_INFOPLIST_FILE, and the test action fails at code-sign time
    # with "the target does not have an Info.plist file and one is not being generated".
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: Afya Yangu Tests
    dependencies:
      - target: AfyaYangu
schemes:
  AfyaYangu:
    build:
      targets:
        AfyaYangu: all
        AfyaYanguTests: [test]
    test:
      targets: [AfyaYanguTests]