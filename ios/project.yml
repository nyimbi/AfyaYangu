name: AfyaYangu
options:
  bundleIdPrefix: ke.go.health
  deploymentTarget:
    iOS: "17.0"
targets:
  AfyaYangu:
    type: application
    platform: iOS
    sources: [AfyaYangu]
    info:
      path: AfyaYangu/Info.plist
      properties:
        CFBundleDisplayName: Afya Yangu
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocationWhenInUseUsageDescription: Afya Yangu uses your location to find the nearest clinics, pharmacies, schools — and to warn you about outbreak risks near you.
  AfyaYanguTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: AfyaYangu
schemes:
  AfyaYangu:
    build:
      targets:
        AfyaYangu: all
        AfyaYanguTests: [test]
    test:
      targets: [AfyaYanguTests]