[project]
	name = "afya"
	version = "2.0.0"
	description = "Mlinzi / Afya Yangu — Kenya national health companion core services (per docs/spec.md v2.0)"
	requires-python = ">=3.11"
	dependencies = [
		"fastapi>=0.115",
		"uvicorn>=0.30",
		"pydantic>=2.9",
		"httpx>=0.27",
		"uuid6>=2024.7.10",
	]

[dependency-groups]
	dev = [
		"pytest>=8",
		"pytest-asyncio>=0.24",
		"pytest-httpserver>=1.1",
		"pyright>=1.1.380",
	]

[build-system]
	requires = ["hatchling"]
	build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
	packages = ["src/afya"]

[tool.pytest.ini_options]
	testpaths = ["tests/ci"]
	asyncio_mode = "auto"
	addopts = "-p no:cacheprovider"

[tool.uv]
	package = true